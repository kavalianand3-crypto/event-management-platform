<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDoXnqutZQgnvFo1m1zX8uCYhP5WSx9brM",
    authDomain: "eventhub-website.firebaseapp.com",
    projectId: "eventhub-website",
    storageBucket: "eventhub-website.firebasestorage.app",
    messagingSenderId: "683301555233",
    appId: "1:683301555233:web:1cc634fd73c627e636e760",
    measurementId: "G-EQJKQDT05S"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("eventForm");
  const message = document.getElementById("formMessage");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const eventType = document.getElementById("eventType").value;
    const eventDate = document.getElementById("eventDate").value;

    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    message.textContent = "Submitting registration...";

    try {
      await addDoc(collection(db, "registrations"), {
        fullName,
        email,
        eventType,
        eventDate,
        createdAt: serverTimestamp()
      });

      message.textContent = "Registration successful!";
      form.reset();
    } catch (error) {
      console.error("Firebase error:", error);
      message.textContent =
        "Registration failed: " + error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
